<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="currentColor" opacity="0.05"/>
  <rect x="10" y="10" width="580" height="340" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="16" y="16" width="568" height="328" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Technical Grid -->
  <g stroke="currentColor" stroke-width="0.5" opacity="0.15">
    <line x1="20" y1="90" x2="580" y2="90"/>
    <line x1="20" y1="180" x2="580" y2="180"/>
    <line x1="20" y1="270" x2="580" y2="270"/>
    <line x1="150" y1="20" x2="150" y2="340"/>
    <line x1="300" y1="20" x2="300" y2="340"/>
    <line x1="450" y1="20" x2="450" y2="340"/>
  </g>

  <!-- Leaf / Botanical Machine Learning Vector -->
  <path d="M 230 180 C 230 100, 310 90, 370 120 C 370 200, 290 230, 230 180 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <path d="M 230 180 Q 300 150 370 120" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M 275 160 Q 285 130 310 125" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M 315 145 Q 330 130 350 135" fill="none" stroke="currentColor" stroke-width="1.2"/>
  
  <!-- ROI Bounding Box & Target Scan -->
  <rect x="210" y="80" width="180" height="150" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="210" cy="80" r="4" fill="currentColor"/>
  <circle cx="390" cy="80" r="4" fill="currentColor"/>
  <circle cx="210" cy="230" r="4" fill="currentColor"/>
  <circle cx="390" cy="230" r="4" fill="currentColor"/>
  <text x="215" y="75" font-family="monospace" font-size="11" fill="currentColor" letter-spacing="1">ROI: 93.8% ACCURACY</text>
  
  <!-- Neural Net Nodes -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="90" y1="120" x2="140" y2="150"/>
    <line x1="90" y1="180" x2="140" y2="150"/>
    <line x1="90" y1="240" x2="140" y2="210"/>
    <line x1="90" y1="180" x2="140" y2="210"/>
    <line x1="140" y1="150" x2="185" y2="180"/>
    <line x1="140" y1="210" x2="185" y2="180"/>
  </g>
  <circle cx="90" cy="120" r="5" fill="currentColor"/>
  <circle cx="90" cy="180" r="5" fill="currentColor"/>
  <circle cx="90" cy="240" r="5" fill="currentColor"/>
  <circle cx="140" cy="150" r="5" fill="currentColor"/>
  <circle cx="140" cy="210" r="5" fill="currentColor"/>
  <circle cx="185" cy="180" r="5" fill="currentColor"/>

  <!-- Metric Badges -->
  <text x="440" y="150" font-family="'Times New Roman', serif" font-size="28" font-weight="bold" fill="currentColor">CNN • RF</text>
  <text x="440" y="175" font-family="monospace" font-size="11" fill="currentColor">-30% LATENCY</text>
  <text x="440" y="195" font-family="monospace" font-size="11" fill="currentColor">FLASK + REACT</text>
  
  <!-- Title Badge -->
  <text x="300" y="305" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" text-anchor="middle" fill="currentColor" letter-spacing="3">AGROXPERT: SMART FARMING AI</text>
</svg>