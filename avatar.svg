<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <rect width="100%" height="100%" fill="currentColor" opacity="0.08"/>
  <rect x="8" y="8" width="304" height="304" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="14" y="14" width="292" height="292" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Subtle line hatching background -->
  <g stroke="currentColor" stroke-width="0.5" opacity="0.3">
    <line x1="20" y1="50" x2="300" y2="50"/>
    <line x1="20" y1="70" x2="300" y2="70"/>
    <line x1="20" y1="90" x2="300" y2="90"/>
    <line x1="20" y1="110" x2="300" y2="110"/>
    <line x1="20" y1="130" x2="300" y2="130"/>
    <line x1="20" y1="150" x2="300" y2="150"/>
    <line x1="20" y1="170" x2="300" y2="170"/>
    <line x1="20" y1="190" x2="300" y2="190"/>
    <line x1="20" y1="210" x2="300" y2="210"/>
    <line x1="20" y1="230" x2="300" y2="230"/>
    <line x1="20" y1="250" x2="300" y2="250"/>
    <line x1="20" y1="270" x2="300" y2="270"/>
  </g>

  <!-- Editorial Monogram / Stylized Seal -->
  <circle cx="160" cy="140" r="75" fill="none" stroke="currentColor" stroke-width="3"/>
  <circle cx="160" cy="140" r="70" fill="none" stroke="currentColor" stroke-width="1"/>
  
  <!-- Stylized Initials 'VM' in Classic Serif -->
  <text x="160" y="160" font-family="'Times New Roman', serif" font-size="64" font-weight="bold" text-anchor="middle" fill="currentColor" letter-spacing="2">VM</text>
  
  <!-- Bottom Ribbon text -->
  <path d="M 50 255 L 270 255" stroke="currentColor" stroke-width="2"/>
  <text x="160" y="244" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" text-anchor="middle" fill="currentColor" letter-spacing="4">VIJAY MURUGAN P</text>
  <text x="160" y="275" font-family="'Times New Roman', serif" font-size="10" font-style="italic" text-anchor="middle" fill="currentColor" letter-spacing="2">CSBS • B.TECH • 2026</text>
</svg>