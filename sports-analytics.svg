<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="currentColor" opacity="0.05"/>
  <rect x="10" y="10" width="580" height="340" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="16" y="16" width="568" height="328" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Relational 3NF & Analytics Diagrams -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <!-- Entity 1: Tournament -->
    <rect x="60" y="80" width="130" height="70"/>
    <line x1="60" y1="105" x2="190" y2="105"/>
    <!-- Entity 2: Match / Live Stats -->
    <rect x="235" y="80" width="130" height="70"/>
    <line x1="235" y1="105" x2="365" y2="105"/>
    <!-- Entity 3: Performance Score -->
    <rect x="410" y="80" width="130" height="70"/>
    <line x1="410" y1="105" x2="540" y2="105"/>
    
    <!-- Relational connectors -->
    <line x1="190" y1="115" x2="235" y2="115"/>
    <line x1="365" y1="115" x2="410" y2="115"/>
    
    <!-- Analytics Chart -->
    <polyline points="70,240 130,210 200,225 280,185 360,195 440,165 520,150" stroke-width="2"/>
  </g>
  
  <text x="125" y="98" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="currentColor">TOURNAMENT</text>
  <text x="75" y="125" font-family="monospace" font-size="10" fill="currentColor">PK: tour_id</text>
  <text x="75" y="140" font-family="monospace" font-size="10" fill="currentColor">FK: team_ref</text>

  <text x="300" y="98" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="currentColor">MATCH_METRICS</text>
  <text x="250" y="125" font-family="monospace" font-size="10" fill="currentColor">live_stats[]</text>
  <text x="250" y="140" font-family="monospace" font-size="10" fill="currentColor">play_clock</text>

  <text x="475" y="98" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="currentColor">3NF_SCORES</text>
  <text x="425" y="125" font-family="monospace" font-size="10" fill="currentColor">perf_index</text>
  <text x="425" y="140" font-family="monospace" font-size="10" fill="currentColor">-45% QUERY TIME</text>

  <!-- Metric Circles on Chart -->
  <circle cx="70" cy="240" r="3.5" fill="currentColor"/>
  <circle cx="130" cy="210" r="3.5" fill="currentColor"/>
  <circle cx="200" cy="225" r="3.5" fill="currentColor"/>
  <circle cx="280" cy="185" r="3.5" fill="currentColor"/>
  <circle cx="360" cy="195" r="3.5" fill="currentColor"/>
  <circle cx="440" cy="165" r="3.5" fill="currentColor"/>
  <circle cx="520" cy="150" r="3.5" fill="currentColor"/>

  <text x="300" y="305" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" text-anchor="middle" fill="currentColor" letter-spacing="3">SPORTS MONITORING &amp; ANALYTICS</text>
</svg>