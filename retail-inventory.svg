<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="currentColor" opacity="0.05"/>
  <rect x="10" y="10" width="580" height="340" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="16" y="16" width="568" height="328" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Barcode & Ledger Graphic -->
  <g fill="currentColor">
    <!-- Barcode strips -->
    <rect x="70" y="80" width="4" height="65"/>
    <rect x="78" y="80" width="8" height="65"/>
    <rect x="90" y="80" width="2" height="65"/>
    <rect x="96" y="80" width="6" height="65"/>
    <rect x="106" y="80" width="4" height="65"/>
    <rect x="114" y="80" width="10" height="65"/>
    <rect x="128" y="80" width="3" height="65"/>
    <rect x="135" y="80" width="7" height="65"/>
    <rect x="146" y="80" width="5" height="65"/>
    <rect x="155" y="80" width="3" height="65"/>
    <rect x="162" y="80" width="8" height="65"/>
    <rect x="174" y="80" width="4" height="65"/>
  </g>
  <text x="125" y="160" font-family="monospace" font-size="9" text-anchor="middle" fill="currentColor" letter-spacing="2">SKU-74892-INV</text>

  <!-- Transaction Box -->
  <rect x="230" y="75" width="310" height="155" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="230" y1="102" x2="540" y2="102" stroke="currentColor" stroke-width="1"/>
  <text x="245" y="94" font-family="monospace" font-size="11" font-weight="bold" fill="currentColor">SQL ACID TRANSACTION ENGINE</text>
  
  <text x="245" y="125" font-family="monospace" font-size="10.5" fill="currentColor">BEGIN TRANSACTION;</text>
  <text x="245" y="145" font-family="monospace" font-size="10.5" fill="currentColor">  UPDATE stock SET qty = qty - 1 WHERE id = ?;</text>
  <text x="245" y="165" font-family="monospace" font-size="10.5" fill="currentColor">  INSERT INTO audit_log (ts, action) VALUES (...);</text>
  <text x="245" y="185" font-family="monospace" font-size="10.5" fill="currentColor">  TRIGGER on_threshold_reorder();</text>
  <text x="245" y="205" font-family="monospace" font-size="10.5" fill="currentColor">COMMIT; -- Concurrency Anomalies: 0</text>

  <!-- Summary stats -->
  <line x1="60" y1="245" x2="540" y2="245" stroke="currentColor" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="268" font-family="monospace" font-size="11" fill="currentColor">JAVA SWING UI</text>
  <text x="240" y="268" font-family="monospace" font-size="11" fill="currentColor">JDBC POOLING</text>
  <text x="380" y="268" font-family="monospace" font-size="11" fill="currentColor">REAL-TIME CSV EXPORT</text>

  <text x="300" y="315" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" text-anchor="middle" fill="currentColor" letter-spacing="3">RETAIL INVENTORY MANAGEMENT SYSTEM</text>
</svg>